<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Food with Faces</title>
<script>try { var t = localStorage.getItem('fwf-theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>

<!-- 字体:PT Mono,Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Mono&display=swap">

<!-- 文件夹结构:
       index.html
       images/fwf-001.jpg   每个角色一张小图(册子右页),文件名和数据里的 img 一致
       images/vis-001.png   自己做的视觉图(册子左页),编号对应角色编号
     图还没放时,显示底色 + 缩写 / 空的位置,不会报错 -->

<style>
  /* ========= 颜色 =========
     所有颜色都在这里,改颜色只改这一处。
     文化历史(H)不用颜色了,改用符号;颜色只留给颜色分类(C) */
  :root {
    --paper: #ffffff;   /* 页面底色 */
    --ink:   #0c0c0c;   /* 文字、粗线 */
    --mute:  #6c6c68;   /* 次要文字 */
    --hair:  #d9d9d5;   /* 细线 */
    --wash:  #f1f1ee;   /* 空缩略图的灰底 */
    --accent:#e5311d;   /* 键盘聚焦框 */
    --font: "PT Mono", "Courier New", monospace;
  }
  /* 深色版本:右上角 Dark / Light 按钮手动切换(记住选择);没选过就跟随系统 */
  :root[data-theme="dark"] { --paper:#0e0e0d; --ink:#f2f2ee; --mute:#9b9b95; --hair:#3a3a37; --wash:#1b1b19; --accent:#ff5a44; color-scheme: dark; }
  :root[data-theme="light"] { color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper:#0e0e0d; --ink:#f2f2ee; --mute:#9b9b95; --hair:#3a3a37; --wash:#1b1b19; --accent:#ff5a44; color-scheme: dark; }
  }

  /* ========= 基础 ========= */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 16px 32px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font);
    font-size: 13px;
    line-height: 1.45;
    font-synthesis: none;            /* 不要浏览器假粗体 */
  }
  h1, h2, h3, b, strong { font-weight: 400; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 1360px; margin: 0 auto; }

  /* ========= 顶部 =========
     参考书的页眉:一行小字 + 黑线 + 导航 */
  .top { position: sticky; top: 0; z-index: 10; background: var(--paper); padding-top: 14px; }
  .strip {
    display: flex; flex-wrap: wrap; gap: 4px 28px;
    font-size: 12px; padding-bottom: 3px;
    border-bottom: 1px solid var(--ink);
  }
  .strip .push { margin-left: auto; }
  nav { display: flex; gap: 22px; padding: 6px 0; border-bottom: 1px solid var(--hair); }
  nav a { text-decoration: none; color: var(--mute); text-transform: uppercase; font-size: 12px; }
  nav a:hover { color: var(--ink); }
  .theme { margin-left: auto; background: none; border: 0; padding: 0; font: inherit; font-size: 12px; text-transform: uppercase; color: var(--mute); cursor: pointer; }
  .theme:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
  nav a[aria-current="page"] { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }

  /* ========= 页面大标题(参考里的 OBJET #280) ========= */
  .vh {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 56px;
    margin: 14px 0; padding-bottom: 6px;
    border-bottom: 1px solid var(--ink);
    font-size: clamp(22px, 3.4vw, 34px);
    letter-spacing: -0.02em;
  }
  /* INDEX 页最大的标题 */
  body.home .sname { display: none; }   /* INDEX 页已经有大标题,顶部小字不重复 */
  .hero { margin: 26px 0 4px; font-size: clamp(38px, 9.6vw, 90px); line-height: 1; letter-spacing: -0.05em; }
  .vh .sub { font-size: 13px; color: var(--mute); letter-spacing: 0; text-transform: uppercase; }
  .vh .r { margin-left: auto; }

  /* ========= 筛选按钮 ========= */
  .filters { display: grid; gap: 8px; margin-bottom: 18px; }
  .frow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .fl { width: 80px; font-size: 11px; text-transform: uppercase; color: var(--mute); }
  .chip {
    font: inherit; font-size: 12px;
    border: 1px solid var(--ink); background: transparent; color: var(--ink);
    padding: 3px 9px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip:hover { background: var(--wash); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .count { margin-left: auto; font-size: 12px; color: var(--mute); }

  /* 符号(文化历史 H):用 currentColor,跟着文字色走,选中反白时也正常 */
  .sy { display: inline-block; flex: none; vertical-align: -1px; }
  /* 色块(颜色分类 C):加淡描边,白色和灰色才看得见 */
  .chip.kc { padding: 4px 6px; border-color: transparent; }   /* 颜色按钮不画描边 */
  .chip.kc:hover, .chip.kc[aria-pressed="true"] { background: var(--wash); color: var(--ink); }   /* 选中:浅灰底 + 显示英文名 */
  .chip.kc .sw { width: 14px; height: 14px; }
  .tagbtn { font: inherit; text-transform: inherit; letter-spacing: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .rv { margin-left: 6px; }
  .tagbtn:hover { text-decoration: underline; text-underline-offset: 3px; }
  .sw { width: 9px; height: 9px; display: inline-block; flex: none; box-shadow: inset 0 0 0 1px rgba(128,128,128,.4); }

  /* ========= 索引网格:8 列、100 格 ========= */
  .grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 20px 14px; }
  .cell { display: block; text-decoration: none; min-width: 0; transition: opacity .15s; }
  .cell .no { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-bottom: 4px; }
  .cell .nm { font-size: 12px; line-height: 1.3; color: var(--mute); margin-top: 6px; white-space: normal; overflow-wrap: anywhere; }   /* 灰色,一行放不下就换行,完整显示 */
  .cell.empty .no { color: var(--hair); }
  .cell.empty .thumb { background: transparent; border: 1px dashed var(--hair); }   /* 没收集的格子:虚线框 */
  .cell.dim { opacity: .14; }                                                        /* 筛选后不符合:变淡 */
  a.cell:hover .thumb { outline: 2px solid var(--ink); }

  /* 缩略图:底色是角色主色,缩写在上面,图片加载成功就盖住 */
  .thumb { position: relative; aspect-ratio: 1/1; background: transparent; overflow: hidden; }   /* 没有图就空着,放了图自动盖上 */
  .thumb img, .fig img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; }
  .bar, .pband { box-shadow: inset 0 0 0 1px rgba(128,128,128,.28); }   /* 白色也看得见 */
  .bar { height: 4px; margin-top: 3px; }   /* 缩略图下面的颜色条,图片盖住底色后还能看到主色 */

  /* 按颜色排列时,每组前面的标题行 */
  .ghead {
    grid-column: 1 / -1; display: flex; gap: 10px; align-items: center;
    margin-top: 8px; padding-top: 3px; border-top: 1px solid var(--ink);
    font-size: 12px; text-transform: uppercase;
  }
  .ghead span:last-child { margin-left: auto; color: var(--mute); }

  /* ========= 单个角色页 =========
     参考:摊开的册子。左页 = 视觉图,右页 = 小图 + 编号信息表,右边是索引标签 */
  .bw { position: relative; max-width: 1060px; padding-right: 62px; }
  .book { display: grid; grid-template-columns: 1fr 36px 1fr; }
  .pg { position: relative; border: 1px solid var(--ink); min-height: 560px; display: flex; flex-direction: column; background: var(--paper); min-width: 0; }
  .pg.l { background: var(--wash); padding: 14px; overflow: hidden; }
  .spine { position: relative; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); background: var(--hair); }
  /* 装订:一个黑色大回形针压在册子中间上方 */
  .clip { position: absolute; top: -46px; left: 50%; width: 52px; height: 156px; margin-left: -26px; transform: rotate(6deg); color: var(--ink); z-index: 3; }

  /* 左页:页眉 / 视觉图 / 页脚 */
  .lt { display: flex; align-items: baseline; gap: 14px; }
  .lt .bn { font-size: 40px; line-height: 1; letter-spacing: -0.03em; }
  .lt .bs { font-size: 11px; color: var(--mute); }
  .lt .bd { margin-left: auto; font-size: 11px; }
  /* 左页的视觉图:铺满整个左页(贴边,不留白边)。想改回留白框,把 .vz 改回 position: relative; flex: 1; margin: 10px 0; min-height: 320px;,
     把 .vz img 的 object-fit 改回 contain */
  .vz { position: absolute; inset: 0; display: grid; place-items: center; }
  .lt, .lb { position: relative; z-index: 1; }
  .lb { margin-top: auto; }
  /* 放了图以后,左页的编号和 Body 文字直接压在图上,黑字,不加暗影、不加底。想换颜色改下面的 color */
  .pg.l:has(.vz img) .lt, .pg.l:has(.vz img) .lb,
  .pg.l:has(.vz img) .lt *, .pg.l:has(.vz img) .lb * { color: #0c0c0c; text-shadow: none; }
  .vz .cap { font-size: 10px; line-height: 1.6; text-align: center; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; }
  .vz img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: var(--wash); }   /* cover = 铺满左页,多出的部分裁掉;想完整显示不裁就改成 contain */
  .lb { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
  .lb .k { display: block; font-size: 10px; text-transform: uppercase; color: var(--mute); }
  .lb .v { font-size: 20px; line-height: 1.1; letter-spacing: -0.02em; }

  /* 右页:名称行 / 信息表 + 小图 / 简介 + 条形码 */
  .rh { display: grid; grid-template-columns: 30px auto 1fr; gap: 0 8px; align-items: baseline; padding: 7px 10px; border-bottom: 1px solid var(--ink); }
  .rh .n { font-size: 10px; color: var(--mute); }
  .rh .b { font-size: 13px; text-transform: uppercase; }
  .rh .nm { text-align: right; font-size: clamp(15px, 1.9vw, 22px); line-height: 1.1; text-transform: uppercase; letter-spacing: -0.02em; overflow-wrap: anywhere; }
  .rb { display: grid; grid-template-columns: 1fr 38%; flex: 1; }
  .rows { border-right: 1px solid var(--ink); min-width: 0; }
  .rs { display: grid; grid-template-columns: 30px 1fr; gap: 0 8px; padding: 4px 10px; border-bottom: 1px solid var(--hair); font-size: 11.5px; text-transform: uppercase; }
  .rs .i { font-size: 10px; color: var(--mute); }
  .rs .k { color: var(--mute); margin-right: 6px; }
  .rs .t { min-width: 0; overflow-wrap: anywhere; }
  .rs .tag { white-space: normal; }   /* 信息表里的标签允许换行,不超出栏 */
  .rs.h { border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
  .rs.h .t { text-align: right; }
  .side { display: flex; flex-direction: column; min-width: 0; }
  .code { font-size: 9px; letter-spacing: .14em; padding: 7px 8px 5px; text-align: right; }
  .pt { position: relative; margin: 0 8px; aspect-ratio: 3/4; background: transparent; overflow: hidden; }
  .pt img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; }
  .pband { height: 12px; margin: 0 8px; }   /* 小图下面的主色条 */
  .nt { padding: 8px 10px 10px; font-size: 11.5px; text-transform: uppercase; }
  .nt p { margin: 0; }
  .bc { display: block; width: 100%; height: 22px; margin-top: 10px; }

  /* 右边的索引标签:上一个 / 下一个 / 回索引 / 年表 */
  .tabs { position: absolute; right: 0; top: 16px; width: 62px; }
  .tab { display: block; height: 34px; margin-bottom: 8px; padding-left: 9px; line-height: 32px; font-size: 10px; text-transform: uppercase; text-decoration: none; border: 1px solid var(--ink); border-left: 0; border-radius: 0 18px 18px 0; background: var(--paper); }
  .tab:hover { background: var(--ink); color: var(--paper); }
  .pno { position: absolute; right: 0; bottom: 0; writing-mode: vertical-rl; transform: rotate(180deg); font-size: clamp(30px, 5vw, 52px); line-height: 1; }

  /* 页面下半:事件、来源 */
  .sec { margin-top: 26px; max-width: 1060px; padding-right: 62px; }
  .sec h2 { font-size: 12px; text-transform: uppercase; margin: 0 0 4px; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); padding: 2px 0; }
  .ev { display: grid; grid-template-columns: 52px 74px 1fr; gap: 4px 12px; padding: 7px 0; border-bottom: 1px solid var(--hair); font-size: 12.5px; }
  .srcs { margin: 6px 0 0; padding: 0; list-style: none; font-size: 12px; }
  .srcs li { padding: 3px 0; border-bottom: 1px solid var(--hair); }
  .srcs .none { color: var(--mute); }
  .sum { font-size: 12px; margin: 0; }
  .tag { display: inline-flex; align-items: center; gap: 5px; margin: 0 8px 2px 0; white-space: nowrap; }

  /* ========= 年表 =========
     整页是一块大画布,朝任何方向都能拖(鼠标 / 手指 / 触控板 / 方向键) */
  body.full { overflow: hidden; }
  body.full .foot { display: none; }
  .cwrap { position: relative; border-bottom: 1px solid var(--ink); }
  .cvp { position: relative; overflow: hidden; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; outline-offset: -2px; }
  .cvp.drag { cursor: grabbing; }
  .board { position: relative; width: max-content; padding: 110px 150px 200px; will-change: transform; }
  .ghost { position: absolute; left: 110px; top: 16px; font-size: 230px; line-height: 1; letter-spacing: -0.06em; color: transparent; -webkit-text-stroke: 1px var(--hair); white-space: nowrap; pointer-events: none; }
  .cgrid { position: relative; display: grid; align-items: start; column-gap: 64px; row-gap: 80px; }
  .ci { display: flex; flex-direction: column; width: 240px; text-decoration: none; }
  .ci .cimg { position: relative; aspect-ratio: 4/3; display: grid; place-items: center; overflow: hidden; margin-bottom: 12px; }
  .ci.flip .cimg { order: 9; margin: 12px 0 0; }   /* 隔一个把图放到文字下面,排版更参差 */
  .ci .cimg .ini { position: relative; font-size: 30px; color: var(--mute); }
  .ci img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: left center; -webkit-user-drag: none; }   /* 事件图:透明底,靠左 */
  .ci .yr { font-size: 72px; line-height: .95; letter-spacing: -0.06em; }
  .ci .meta { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); margin: 10px 0 6px; }
  .ci .meta .sy { width: 13px; height: 13px; }
  .ci p { margin: 0 0 6px; font-size: 11px; }
  .ci .who { font-size: 11px; text-decoration: underline; text-underline-offset: 3px; }
  .ci:hover .yr { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 8px; }
  .cleg, .chint { position: absolute; bottom: 0; background: var(--paper); border-top: 1px solid var(--ink); padding: 5px 10px; font-size: 10.5px; }
  .cleg { left: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; max-width: 78%; border-right: 1px solid var(--ink); }
  .chint { right: 0; color: var(--mute); text-transform: uppercase; border-left: 1px solid var(--ink); }

  /* ========= 分类说明页 ========= */
  .sys { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 32px; }
  .sys section { min-width: 0; }
  .sys h2 { font-size: 12px; text-transform: uppercase; margin: 0 0 6px; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); padding: 2px 0; }
  .sys ol { margin: 0; padding: 0; list-style: none; }
  .sys .sum { margin-top: 10px; }
  .sys li { display: grid; grid-template-columns: 64px 1fr; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--hair); }

  .foot { margin-top: 38px; padding-top: 3px; border-top: 1px solid var(--ink); font-size: 12px; }

  /* ========= 手机宽度:列数逐级减少,页面不横向滚动 ========= */
  @media (max-width: 980px) {
    .grid  { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  }
  @media (max-width: 640px) {
    .grid  { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px 8px; }
    .sys   { grid-template-columns: 1fr; }
    .fl    { width: 100%; }
    .vh    { gap: 2px 24px; }
    .ev    { grid-template-columns: 44px 1fr; }
    .ev .t { grid-column: 1 / -1; }
    .cell .nm { display: none; }
    /* 册子改成上下两页,标签排成一行 */
    .bw    { padding-right: 0; }
    .book  { grid-template-columns: 1fr; }
    .spine { display: none; }
    .pg.l  { border-bottom: 0; }
    .rb    { grid-template-columns: 1fr; }
    .rows  { border-right: 0; }
    .side  { order: -1; padding-bottom: 8px; border-bottom: 1px solid var(--ink); }   /* 手机上小图放在信息表前面,并且缩小 */
    .pt, .pband { width: 46%; }
    .code  { text-align: left; }
    .tabs  { position: static; width: auto; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .tab   { margin: 0; padding: 0 14px; border-left: 1px solid var(--ink); border-radius: 18px; }
    .pno   { display: none; }
    .sec   { padding-right: 0; }
    /* 年表画布 */
    .ci    { width: 200px; }
    .ci .yr { font-size: 56px; }
    .board { padding: 70px 40px 150px; }
    .ghost { font-size: 140px; left: 30px; }
  }
</style>
</head>

<body>
<!-- 页面骨架:顶部 / 中间 #view / 底部。#view 的内容全由下面的 JS 按网址里的 # 画出来 -->
<div class="wrap">
  <header class="top">
    <div class="strip">
      <span>FWF</span>
      <span class="sname">Food with Faces</span>
      <span class="push" id="hcount"></span>
    </div>
    <nav aria-label="Sections">
      <a href="#index" data-nav="index">Index</a>
      <a href="#chronicle" data-nav="chronicle">Chronicle</a>
      <a href="#system" data-nav="system">System</a>
      <button type="button" class="theme" id="theme" aria-label="Switch light or dark theme">Dark</button>
    </nav>
  </header>

  <main id="view"></main>

  <footer class="foot" id="fcount"></footer>
</div>

<script>
(function () {

  /* ================================================================
     1. 三套分类
     H 文化历史 6 个标签,用符号区分(不用颜色)
     V 视觉分类 4 种身体构成
     C 颜色分类 9 个家族(一个角色可以有多个主色)
     F 食物种类 9 类(食物本身是什么)
     筛选、年表、角色页都从这里读名字,改名字只改这里
     ================================================================ */

  // H:s 是符号名,对应下面的 SYM
  var H = {
    H01: { name: 'Origin & Creation',             s: 'circle'   },
    H02: { name: 'Identity & Representation',     s: 'square'   },
    H03: { name: 'Cultural Circulation',          s: 'plus'     },
    H04: { name: 'Controversy & Public Response', s: 'triangle' },
    H05: { name: 'Redesign & Transformation',     s: 'diamond'  },
    H06: { name: 'Disappearance & Revival',       s: 'ring'     }
  };

  // 符号的形状(10×10 的 SVG)。想换符号,改这里
  var SYM = {
    circle:   '<circle cx="5" cy="5" r="4.2"/>',
    square:   '<rect x="1" y="1" width="8" height="8"/>',
    plus:     '<path d="M5 1v8M1 5h8" fill="none" stroke="currentColor" stroke-width="1.6"/>',
    triangle: '<path d="M5 .8 9.4 9H.6z"/>',
    diamond:  '<path d="M5 .4 9.6 5 5 9.6.4 5z"/>',
    ring:     '<circle cx="5" cy="5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.5"/>'
  };

  var V = {
    'food-body': 'Food as Body',
    'food-head': 'Food as Head',
    'pack-body': 'Packaging as Body',
    'mat-body':  'Food Material as Body'
  };

  // F 食物种类:这个角色的食物本身属于哪一类
  var FG = {
    F01: 'Fruit',
    F02: 'Vegetable',
    F03: 'Nut, Seed & Spice',
    F04: 'Bread & Dough',
    F05: 'Sweets & Candy',
    F06: 'Cakes, Cookies & Pastry',
    F07: 'Rice, Noodles & Dishes',
    F08: 'Fast Food',
    F09: 'Meat, Seafood & Egg'
  };

  var COUNTRY = { US: 'United States', JP: 'Japan', UK: 'United Kingdom', KR: 'South Korea' };

  /* 颜色分类 C
     参考 Pauls Kupcis 的索引册:同类东西用颜色排成一整块,一眼看出分组。
     只记每个角色主色的 hex,家族由 family() 按规则算,标准固定。

        '<div class="frow"><span class="fl">Visual</span>' + vc + '</div>' +
        '<div class="frow"><span class="fl">Food</span>' + gc + '</div>' +
        (kc ? '<div class="frow"><span class="fl">Colour</span>' + kc + '</div>' : '') +   // 一个颜色都没取时不显示这一行
        '<div class="frow"><span class="fl">History</span>' + hc + '</div>' +
        '<div class="frow"><span class="fl">Country</span>' + cc + '<span class="count">' + S.filter(matches).length + ' / ' + S.length + ' specimens</span></div>' +
      '</div>' +
      '<div class="grid">' + cells + '</div>';
  }

  // ---- 年表页:一整块可以四面拖动的大画布 ----
  var pan = null;   // 当前画布的拖动状态,离开年表页就清掉

  // 拖动:鼠标 / 手指 / 触控板 / 方向键,范围限制在画布大小里
  function makePan(wrap, vp, board) {
    var x = 0, y = 0, d = null, moved = false;

    function go(nx, ny) {
      var minX = Math.min(0, vp.clientWidth - board.offsetWidth);
      var minY = Math.min(0, vp.clientHeight - board.offsetHeight);
      x = Math.max(minX, Math.min(0, nx));
      y = Math.max(minY, Math.min(0, ny));
      board.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    }
    // 高度撑满窗口剩下的部分,窗口变化时重新算
    function fit() {
      vp.style.height = Math.max(320, window.innerHeight - wrap.getBoundingClientRect().top - 14) + 'px';
      go(x, y);
    }

    vp.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      d = { px: e.clientX, py: e.clientY, ox: x, oy: y };
      moved = false;
    });
    vp.addEventListener('pointermove', function (e) {
      if (!d) return;
      var dx = e.clientX - d.px, dy = e.clientY - d.py;
      // 先动超过 5px 才算拖动,不然点链接会被吃掉
      if (!moved && Math.abs(dx) + Math.abs(dy) > 5) {
        moved = true;
        vp.classList.add('drag');
        try { vp.setPointerCapture(e.pointerId); } catch (err) {}
      }
      if (moved) go(d.ox + dx, d.oy + dy);
    });
    function end() { d = null; vp.classList.remove('drag'); }
    vp.addEventListener('pointerup', end);
    vp.addEventListener('pointercancel', end);
    // 拖完松手不要触发链接跳转
    vp.addEventListener('click', function (e) {
      if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; }
    }, true);

    vp.addEventListener('wheel', function (e) {
      e.preventDefault();
      var k = e.deltaMode === 1 ? 16 : 1;
      go(x - e.deltaX * k, y - e.deltaY * k);
    }, { passive: false });
    vp.addEventListener('keydown', function (e) {
      var m = { ArrowLeft: [120, 0], ArrowRight: [-120, 0], ArrowUp: [0, 120], ArrowDown: [0, -120] }[e.key];
      if (m) { e.preventDefault(); go(x + m[0], y + m[1]); }
    });

    fit();
    return { fit: fit };
  }

  function renderChron() {
    var ev = E.slice().sort(function (a, b) { return a.y - b.y; });
    if (!ev.length) { view.innerHTML = '<h1 class="vh"><span>CHRONICLE</span></h1><p class="sum">No events yet.</p>'; return; }
    var cols = Math.max(5, Math.round(Math.sqrt(ev.length * 1.6)));   // 事件越多,画布越宽
    var drop = [0, 72, 26, 118, 50];                                  // 每格往下错开的距离,排版参差

    var items = ev.map(function (e, i) {
      var s = S[e.n - 1], col = i % cols, row = Math.floor(i / cols);
      var top = drop[(col * 3 + row * 2) % drop.length];
      // 事件有图就放图;没图的事件只有文字
      var pic = '<span class="cimg"><img src="' + esc(e.img) + '"' + (e.alt ? ' data-alt="' + esc(e.alt) + '"' : '') +
        ' alt="" draggable="false" onerror="var a=this.getAttribute(\'data-alt\');if(a){this.removeAttribute(\'data-alt\');this.src=a}else{this.remove()}"></span>';
      return '<a class="ci' + (i % 2 ? ' flip' : '') + '" href="#' + s.hash + '" style="margin-top:' + top + 'px">' + pic +
        '<span class="yr">' + e.y + '</span>' +
        '<span class="meta">' + sym(e.h) + e.h + ' ' + esc(H[e.h].name) + '</span>' +
        '<p>' + esc(e.t) + '</p>' +
        '<span class="who">' + s.id + ' ' + esc(s.name) + '</span></a>';
    }).join('');

    var legend = Object.keys(H).map(function (k) {
      return '<span class="tag">' + sym(k) + k + ' ' + esc(H[k].name) + '</span>';
    }).join('');
    var span = ev[0].y + ' - ' + ev[ev.length - 1].y;

    view.innerHTML =
      '<h1 class="vh"><span>CHRONICLE</span><span class="sub">Events by year</span><span class="r">' + span + '</span></h1>' +
      '<div class="cwrap">' +
        '<div class="cvp" tabindex="0" role="region" aria-label="Chronicle canvas. Drag or use arrow keys to move.">' +
          '<div class="board"><div class="ghost">' + span.replace(' - ', '-') + '</div>' +
          '<div class="cgrid" style="grid-template-columns:repeat(' + cols + ',240px)">' + items + '</div></div>' +
        '</div>' +
        '<div class="cleg">' + legend + '</div>' +
        '<div class="chint">Drag / scroll / arrow keys</div>' +
      '</div>';

    var wrap = view.querySelector ? view.querySelector('.cwrap') : null;
    if (wrap) pan = makePan(wrap, wrap.querySelector('.cvp'), wrap.querySelector('.board'));
  }

  // ---- 分类说明页:对照规则用 ----
  function renderSystem() {
    var hl = Object.keys(H).map(function (k) {
      return '<li><span>' + sym(k) + ' ' + k + '</span><span>' + esc(H[k].name) + '</span></li>';
    }).join('');
    var vl = Object.keys(V).map(function (k, i) {
      return '<li><span>V0' + (i + 1) + '</span><span>' + esc(V[k]) + '</span></li>';
    }).join('');
    var cl = Object.keys(FAM).map(function (k) {
      return '<li><span>' + fsw(k) + ' ' + k + '</span><span>' + esc(FAM[k].name) + '</span></li>';   // 一行一个:色块 + 代码 + 英文名
    }).join('');

    view.innerHTML =
      '<h1 class="vh"><span>SYSTEM</span><span class="sub">Three classification systems</span></h1>' +
      '<div class="sys">' +
        '<section><h2>Entry rules</h2><ol>' +
          '<li><span>R1</span><span>The food, drink, candy or its packaging is itself the character.</span></li>' +
          '<li><span>R2</span><span>It has a face or human traits.</span></li>' +
          '<li><span>R3</span><span>At least one checkable source for year and creator or brand.</span></li></ol></section>' +
        '<section><h2>Record fields</h2><ol>' +
          '<li><span>A</span><span>ID, name, year, country, creator, category, food group, medium, status</span></li>' +
          '<li><span>B</span><span>Image, body construction, colour, features</span></li>' +
          '<li><span>C</span><span>Events with year and source</span></li></ol></section>' +
        '<section><h2>Visual classification</h2><ol>' + vl + '</ol></section>' +
        '<section><h2>Cultural history</h2><ol>' + hl + '</ol></section>' +
        '<section><h2>Colour classification</h2><ol>' + cl + '</ol>' +
          '<p class="sum">A character can have several colours, recorded as RGB values. The family is calculated from hue, saturation and lightness. The first colour decides the order.</p></section>' +
        '<section><h2>Food classification</h2><ol>' + Object.keys(FG).map(function (k) {
          return '<li><span>' + k + '</span><span>' + esc(FG[k]) + '</span></li>';
        }).join('') + '</ol></section>' +
      '</div>';
  }

  // 条形码:按编号字符生成,只是装饰
  function barcode(str) {
    var x = 0, out = '';
    str.toUpperCase().split('').forEach(function (ch) {
      var c = ch.charCodeAt(0);
      for (var b = 0; b < 8; b++) {
        var w = ((c >> b) & 1) ? 3 : 1.5;
        if (b % 2 === 0) out += '<rect x="' + x + '" y="0" width="' + w + '" height="20"/>';
        x += w + 1;
      }
    });
    return '<svg class="bc" viewBox="0 0 ' + x + ' 20" preserveAspectRatio="none" fill="currentColor" aria-hidden="true">' + out + '</svg>';
  }

  // ---- 单个角色页:摊开的册子 ----
  function renderSpec(s) {
    var prev = S[s.n - 2], next = S[s.n];
    var evs = E.filter(function (e) { return e.n === s.n; }).sort(function (a, b) { return a.y - b.y; });

    // 右页的一行:编号 + 名称 + 值(大写由样式处理)
    function row(i, k, v) { return '<div class="rs"><span class="i">' + i + '</span><span class="t"><span class="k">' + k + '</span>' + v + '</span></div>'; }
    function head(i, label) { return '<div class="rs h"><span class="i">' + i + '</span><span class="t">[' + label + ']</span></div>'; }

    var rows =
      head('02', 'Record') +
      row('a.', 'Year', esc(s.year)) +
      row('b.', 'Country', esc(COUNTRY[s.country] || s.country)) +
      row('c.', 'Creator', esc(s.creator)) +
      row('d.', 'Medium', esc(s.medium)) +
      row('e.', 'Status', esc(s.status)) +
      row('f.', 'Group', esc(FG[s.fg] || '-')) +
      head('03', 'Visual') +
      row('a.', 'Body', esc(V[s.body])) +
      row('b.', 'Colour', s.color.map(function (c) { return '<button type="button" class="tag tagbtn" data-reveal="' + rgbText(c) + '" aria-label="' + rgbText(c) + '"><i class="sw" style="background:' + c + '"></i><span class="rv"></span></button>'; }).join('') || '-') +
      row('c.', 'Family', s.fams.map(function (f) { return '<button type="button" class="tag tagbtn" data-reveal="' + f + ' ' + esc(FAM[f].name) + '" aria-label="' + esc(FAM[f].name) + '">' + fsw(f) + '<span class="rv"></span></button>'; }).join('') || '-') +
      row('d.', 'Features', esc(s.feat)) +
      head('04', 'History') +
      row('a.', 'Primary', tag(s.primary)) +
      row('b.', 'Also', s.tags.slice(1).map(tag).join('') || '-') +
      row('c.', 'Events', String(evs.length));

    var left =
      '<div class="pg l">' +
        '<div class="lt"><span class="bn">' + pad(s.n) + '</span><span class="bs">FWF</span><span class="bd">[' + esc(s.year) + '] ' + esc(s.country) + '</span></div>' +
        // 空位置:放自己的视觉图,文件放进 images 就自动盖住这块
        '<div class="vz"><span class="cap">Visual<br>' + esc(s.vis) + '</span>' +
          '<img src="' + esc(s.vis) + '" alt="' + esc(s.name) + ' visual" onerror="this.remove()"></div>' +
        '<div class="lb"><div><span class="k">Body</span><span class="v">' + esc(V[s.body]) + '</span></div></div>' +
      '</div>';

    var right =
      '<div class="pg r">' +
        '<div class="rh"><span class="n">01</span><span class="b">[' + esc(s.food) + ']</span><span class="nm">' + esc(s.name) + '</span></div>' +
        '<div class="rb"><div class="rows">' + rows + '</div>' +
          '<div class="side"><div class="code">' + s.id.replace('-', '') + ' ' + esc(s.year) + '</div>' +
            '<div class="pt">' + IMG(s) + '</div>' +
            '<div class="pband" style="background:' + stripes(s.color) + '"></div></div></div>' +
        head('05', 'Summary') +
        '<div class="nt"><p>' + esc(s.sum) + '</p>' + barcode(s.id + s.year + s.country) + '</div>' +
      '</div>';

    var tabs =
      '<div class="tabs" role="navigation" aria-label="Specimen navigation">' +
        (prev ? '<a class="tab" href="#' + prev.hash + '">&larr; Prev</a>' : '') +
        (next ? '<a class="tab" href="#' + next.hash + '">Next &rarr;</a>' : '') +
        '<a class="tab" href="#index">Index</a><a class="tab" href="#chronicle">Chron</a></div>';

    view.innerHTML =
      '<h1 class="vh"><span>' + s.id + '</span><span>SPECIMEN</span><span class="r">#' + pad(s.n) + '</span></h1>' +
      '<div class="bw"><div class="book">' + left +
        '<div class="spine">' +
          '<svg class="clip" viewBox="0 0 28 84" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M11 68V20a8 8 0 0 1 16 0v46a13 13 0 0 1-26 0V28"/></svg></div>' +
        right + '</div>' +
        tabs + '<div class="pno" aria-hidden="true">P' + pad(s.n) + '</div></div>' +

      '<div class="sec"><h2>Events</h2>' + (evs.map(function (e) {
        return '<div class="ev"><span>' + e.y + '</span><span><span class="tag" title="' + esc(H[e.h].name) + '">' + sym(e.h) + e.h + '</span></span><span class="t">' + esc(e.t) + '</span></div>';
      }).join('') || '<div class="ev"><span>-</span></div>') + '</div>' +

      '<div class="sec"><h2>Sources</h2><ul class="srcs">' + (s.src.map(function (x) {
        return '<li><a href="' + esc(x[1]) + '" target="_blank" rel="noopener noreferrer">' + esc(x[0]) + '</a></li>';
      }).join('') || '<li class="none">-</li>') + '</ul></div>';      // 来源先空着:区块保留,显示一个横线
  }


  /* ================================================================
     7. 路由
     不用多个 html,靠网址里的 # 切换页面:
       #index  #chronicle  #system  #fwf-001(某个角色)
     ================================================================ */
  function route() {
    pan = null;
    if (!S.length) {
      view.innerHTML = '<h1 class="vh"><span>NO DATA</span></h1>';
      return;
    }
    var h = (location.hash || '#index').slice(1);
    var s = byHash(h);
    if (!s && ['index', 'chronicle', 'system'].indexOf(h) < 0) h = 'index';
    var current = s ? 'index' : h;      // 在角色页时,导航高亮 Index

    document.querySelectorAll('nav a').forEach(function (a) {
      if (a.getAttribute('data-nav') === current) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });

    if (document.body) document.body.classList.toggle('home', !s && h === 'index');
    if (document.body) document.body.classList.toggle('full', !s && h === 'chronicle');   // 年表页:整页不滚动,只拖画布
    if (s) renderSpec(s);
    else if (h === 'chronicle') renderChron();
    else if (h === 'system') renderSystem();
    else renderIndex();
  }

  // 点筛选按钮
  view.addEventListener('click', function (e) {
    var rv = e.target.closest && e.target.closest('button[data-reveal]');
    if (rv) {                                                            // 角色页:点色块,旁边出现文字;再点收起
      var sp = rv.querySelector('.rv');
      sp.textContent = sp.textContent ? '' : rv.getAttribute('data-reveal');
      return;
    }
    var b = e.target.closest && e.target.closest('button[data-f]');
    if (!b) return;
    var f = b.getAttribute('data-f'), k = b.getAttribute('data-k');
    if (f === 'o') order = k;                      // 排列方式:点哪个用哪个
    else filt[f] = (filt[f] === k) ? null : k;     // 筛选:再点一次取消
    renderIndex();
  });

  window.addEventListener('resize', function () { if (pan) pan.fit(); });
  window.addEventListener('hashchange', function () { route(); window.scrollTo(0, 0); });

  /* ================================================================
     8. 启动
     ================================================================ */
  // 深色 / 浅色切换
  (function () {
    var btn = document.getElementById('theme'), root = document.documentElement;
    var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    function cur() { return root.getAttribute('data-theme') || (mq && mq.matches ? 'dark' : 'light'); }
    function label() { btn.textContent = cur() === 'dark' ? 'Light' : 'Dark'; }   // 按钮写的是点了会变成什么
    btn.addEventListener('click', function () {
      var next = cur() === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('fwf-theme', next); } catch (e) {}
      label();
    });
    label();
  })();

  setData(DATA_S, DATA_E);
  var count = S.length + ' / ' + TOTAL;
  document.getElementById('hcount').textContent = 'Archive ' + count;
  document.getElementById('fcount').textContent = 'Archive (' + count + ')';
  route();
})();
</script>
</body>
